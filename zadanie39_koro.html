<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korol z39</title>
</head>

<body>
    <h1 style="color:green;">MENU</h1>
    <p style="color:red; font-weight: bold;">1. CZERWONY</p>
    <p style="color:blue; font-weight: bold;">2. NIEBIESKI</p>
    <input type="button" name="korol" value="Oblicz" onclick="fun_kor()" />
    <script>
        function fun_kor() {
            var x_kor = prompt("Podaj kolor", "");
            if (x_kor == 1 || x_kor.toLowerCase() == "czerwony") 
            { 
                document.write('<h1 style="color:red;">wczytałeś kolor czerwony</h1><br />');
            } 
            else if (x_kor == 2 || x_kor.toLowerCase() == "niebieski")
            { 
                document.write('<h6 style="color:blue;">wczytałeś kolor niebieski</h6><br />'); 
            }
        }
    </script>
</body>

</html>
