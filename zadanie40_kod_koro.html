<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <title>Korol Z40</title>
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            var x = prompt("podaj argument x=", "");
            var x_kor = parseFloat(x);
            document.write("Wykonał Korol Maciej <br>")
            document.write("czytany argument x=" + x_kor + "<br>");
            function f_kor(x_kor) {
                if (x_kor >= 1) { return 1; }
                if ((x_kor => -2) && (x_kor < 1)) { return x_kor * x_kor; }
                if (x_kor < -2) { return 4; }
            }
            document.write("f=" + f_kor(x_kor) + "<br>");
        </script>
    </div>
</body>

</html>
