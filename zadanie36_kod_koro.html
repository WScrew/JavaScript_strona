    <textarea rows="25" cols="100">
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Korol Z36</title>
        </head>
        <body>
            <script>
                var a_maci_kor=parseFloat(prompt("napisz liczbe"));
                if(a_maci_kor%2==0)
                {
                    document.write("liczba " + a_maci_kor + " jest parzysta");
                }
                else if(a_maci_kor%2!=0)
                {
                    document.write("liczba " + a_maci_kor + " nie jest parzystą")
                }
            </script>
        </body>
        </html>

        <!--  Korol Z36_JS  -->
    </textarea>
