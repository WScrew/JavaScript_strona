<body>

    <h1>Zadanie 46 Maciej Korol</h1>
    
    <p>ilość wykonania pętli = 11</p>
    <p>wielkość liter = 42px</p>

    <div style="font-size: 42px;">
        <script>
            
            for (let i_kor = 1; i_kor <= 11; i_kor++) {
                if (i_kor % 2 !== 0) {  
                    document.write(i_kor + ". Korol<br>");
                } else {
                    document.write(i_kor + ". Maciej<br>");
                }
                
            }
        </script>
    </div>
