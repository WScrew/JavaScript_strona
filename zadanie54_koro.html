<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 54 Maciej Korol</title>
</head>
<body>

    <pre style="font-family: monospace; font-size: 20px; line-height: 1.2;">
<script>
    let a_kor = 6;
    let b_kor = 20;

    for (let i = 1; i <= b_kor; i++) {
        document.write("*");
    }
    document.write("<br>");

    for (let i = 1; i <= a_kor - 2; i++) {
        document.write("*");
        for (let j = 1; j <= b_kor - 2; j++) {
            document.write("&nbsp;");
        }
        document.write("*<br>");
    }

    for (let i = 1; i <= b_kor; i++) {
        document.write("*");
    }
    document.write("<br>");
</script>
    </pre>

</body>
</html>
