<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 52 Maciej Korol</title>
</head>
<body>

    <p style="margin-left: 2cm; color: red;">Korol</p>
    <p style="margin-left: 5mm; color: blue;">Wyprowadzanie liczb od 1 do 10 przesuniętych o jedną spację w prawo. Demonstracja pętli zagnieżdżonych ( czyli pętla w pętli).</p>

    <script>
        for (var i = 1; i <= 10; i++) {
            for (var n = 1; n <= i; n++) {
                document.write("&nbsp;");
            }
            document.write(i + "<br>");
        }
    </script>

</body>
</html>
