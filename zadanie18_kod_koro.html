<!DOCTYPE html>

<head>
    <title> Użycie fukcji </title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:navy;font-size:50px;">
        <script language="JavaScript">
            var a = parseFloat(prompt("a=", ""));
            var b = parseFloat(prompt("b=", ""));
            function suma_kor(a, b) {
                return a + b;
            }
            function odejmowanie_kor(a, b) {
                return a - b;
            }
            document.write("suma=" + suma_kor(a, b) + "<br>"); 
            document.write("suma=" + odejmowanie_kor(a, b) + "<br>"); 
            
        </script>
    </div>
</body>
