<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 58 Maciej Korol</title>
</head>
<body>

    <script>
        for (let i_kor = 0; i_kor <= 39; i_kor++) {
            let w_i = (i_kor * i_kor) + i_kor + 41;
            document.write("i=" + i_kor + "&nbsp;&nbsp;&nbsp;&nbsp;w(" + i_kor + ")=" + w_i + "<br>");
            
            if ((i_kor + 1) % 5 === 0) {
                document.write("<br>");
            }
        }
    </script>

</body>
</html>
