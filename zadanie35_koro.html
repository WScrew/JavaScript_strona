<!DOCTYPE html>
<html lang="pl-PL">

<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            var x = prompt("podaj liczbę x=", "");
            var a_maci_kor = parseFloat(x);
            document.write("czytana liczba x=" + a_maci_kor + "<br>");
            if (a_maci_kor > 0) { document.write("czytana liczba jest większa od 0" + "<br>"); }
            else if (a_maci_kor < 0) { document.write("Czytana liczba jest mniejsza od 0" + "<br>") }
            else if (a_maci_kor === 0) { document.write("Czytalna liczba jest zero" + "<br>") }
        </script>
    </div>
</body>

</html>
