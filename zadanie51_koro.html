<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Zadanie 51 Maciej Korol</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:black; font-size:24px; font-family:sans-serif;">
        <script>
            let n_kor = parseInt(prompt("Podaj liczbę n:", "6"));
            let silnia_kor = 1;

            if (n_kor > 0) {
                for (let i_kor = 1; i_kor <= n_kor; i_kor++) {
                    silnia_kor = silnia_kor * i_kor;
                }
            }

            document.write("n=" + n_kor + "<br>");
            document.write(n_kor + "!=" + silnia_kor);
        </script>
    </div>
</body>
</html>
