<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 59 Maciej Korol</title>
</head>
<body>

	<script>
		let nr = 8;
		let koniec = nr + 15;
		for (let i_kor = nr; i_kor <= koniec; i_kor++) {

			let pierw2 = Math.sqrt(i_kor).toFixed(2);
			let pierw4 = Math.sqrt(Math.sqrt(i_kor)).toFixed(2);

			document.write(
				"I=" + i_kor +
				" &nbsp; pierw_2(" + i_kor + ")=" + pierw2 +
				" &nbsp; pierw_4(" + i_kor + ")=" + pierw4 +
				"<br>"
			);

			if ((i_kor - nr + 1) % 3 === 0) {
				document.write("<br>");
			}
		}
	</script>
	
</body>
</html>
