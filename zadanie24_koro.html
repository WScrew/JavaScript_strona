<!DOCTYPE html>
<head>
    <title> proste obliczenia</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            var liczba1 = prompt("liczba1=", "");
            var liczba2 = prompt("liczba2=", "");
            var suma;
            var x1_kor = parseFloat(liczba1);
            var x2_kor = parseFloat(liczba2);
            document.write("x1= " + x1_kor + "&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp" + " x2= " + x2_kor + "<br>");
            
            var y1_kor=3*Math.pow(x1_kor, 5/7);
            document.write("y1="+y1_kor.toFixed(2)+"<br>");

            var rad_x1_kor=(x1_kor*Math.PI)/180;
            var y2_kor=2*Math.cos(rad_x1_kor)+3*Math.sin(rad_x1_kor);
            document.write("y2="+y2_kor.toFixed(2)+"<br>");

            akuku_kor=Math.pow(x1_kor,5)+2*Math.pow(x2_kor,4);
            y3_kor=Math.pow(akuku_kor,1/3)*Math.abs(x1_kor-x2_kor);
            document.write("y3="+y3_kor.toFixed(2)+"<br>");
        </script>
    </div>
</body>
</html>
