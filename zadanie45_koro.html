<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 45_Maciej Korol</title>
</head>
<body>

    <h1>Zadanie 45</h1>
    <script>
        // Wczytanie liczby od użytkownika za pomocą okienka prompt
        let koniec_petli_kor = prompt("Podaj liczbę końcową pętli:", "20");
        koniec_petli_kor = parseInt(koniec_petli_kor);

        document.write("Liczby parzyste od 2 do " + koniec_petli_kor + ":<br>");

        // Pętla wypisująca liczby parzyste
        for (let i_kor = 2; i_kor <= koniec_petli_kor; i_kor += 2) {
            document.write(i_kor + " ");
        }
    </script>

</body>
</html>
