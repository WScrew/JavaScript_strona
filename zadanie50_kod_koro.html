<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Zadanie 50 Maciej Korol</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:black; font-size:24px; font-family:sans-serif;">
        <script>
            let suma_kor = 0;

            for (let i_kor = 1; i_kor <= 1000000; i_kor++) {
                suma_kor = suma_kor + 1 / i_kor;
            }

            document.write("Suma szeregu harmonicznego od 1 do 1000000 wynosi:<br>");
            document.write("suma_kor = " + suma_kor);
        </script>
