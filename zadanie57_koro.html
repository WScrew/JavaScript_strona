<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 57 Maciej Korol</title>
</head>
<body>

    <script>
        let l1_t_kor;
        do {
            l1_t_kor = parseInt(prompt("Podaj pierwszą liczbę z przedziału <20,60>:", ""));
            if (l1_t_kor < 20 || l1_t_kor > 60) {
                alert("liczba l1 nie należy do przedziału <20,60>");
            }
        } while (l1_t_kor < 20 || l1_t_kor > 60);

        let l2_t_kor;
        do {
            l2_t_kor = parseInt(prompt("Podaj drugą liczbę z przedziału <20,60>:", ""));
            if (l2_t_kor < 20 || l2_t_kor > 60) {
                alert("liczba l2 nie należy do przedziału <20,60>");
            }
        } while (l2_t_kor < 20 || l2_t_kor > 60);

        let pocz_kor = parseInt(prompt("Podaj początkową wielkość tekstu (px):", "20"));
        let tekst_kor = prompt("Podaj dowolny tekst:", "");

        let i = pocz_kor;

        if (l1_t_kor < l2_t_kor) {
            while (i <= 100) {
                document.write("<p style=\"font-size:" + i + "px; color: black;\"><br>" + tekst_kor + "<br></p>");
                i += 5;
            }
        } else if (l1_t_kor > l2_t_kor) {
            while (i >= 0) {
                document.write("<p style=\"font-size:" + i + "px; color: black;\"><br>" + tekst_kor + "<br></p>");
                i -= 5;
            }
        } else {
            document.write("<p style=\"font-size:" + i + "px; color: black;\"><br>" + tekst_kor + "<br></p>");
        }
    </script>

</body>
</html>
